<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator · Lacuna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Pinyon+Script&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Glacial Indifference';
            font-style: normal;
            font-weight: 400;
            src: local('Glacial Indifference'), url('https://fonts.cdnfonts.com/s/31913/GlacialIndifference-Regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Glacial Indifference';
            font-style: normal;
            font-weight: 700;
            src: local('Glacial Indifference'), url('https://fonts.cdnfonts.com/s/31913/GlacialIndifference-Bold.woff') format('woff');
        }
        :root {
            --offwhite: #f4f1e8;
            --bg: #141619;
            --sidebar-bg: #1c1e22;
            --panel: #202328;
            --fg: #f0f2f5;
            --gray: #8e95a2;
            --light: #262930;
            --border: #2e323b;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --active-item: #282c34;
            --topbar-bg: rgba(20, 22, 25, 0.94);
            --tag-bg: #10b981;
            --tag-fg: #000000;
            --shadow: rgba(0, 0, 0, 0.35);
            --headline-font: "Glacial Indifference", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius: 8px;
            --sidebar-width: 250px;
        }

        body[data-theme="pitch-black"] {
            --bg: #000000;
            --sidebar-bg: #0d0d0d;
            --panel: #141414;
            --fg: #f5f5f5;
            --gray: #888888;
            --light: #1c1c1c;
            --border: #242424;
            --accent: #10b981;
            --active-item: #202020;
            --topbar-bg: rgba(0, 0, 0, 0.94);
            --tag-bg: #ffffff;
            --tag-fg: #000000;
        }

        body[data-theme="light"] {
            --bg: #f4f5f7;
            --sidebar-bg: #ffffff;
            --panel: #ffffff;
            --fg: #111827;
            --gray: #6b7280;
            --light: #f3f4f6;
            --border: #e5e7eb;
            --accent: #10b981;
            --active-item: #f3f4f6;
            --topbar-bg: rgba(244, 245, 247, 0.94);
            --tag-bg: #111827;
            --tag-fg: #ffffff;
        }

        body[data-theme="palette-one"] {
            --bg: #FFEBAF;
            --sidebar-bg: #f7e3a6;
            --panel: #FFEBAF;
            --fg: #2c4f5e;
            --gray: #5f91a3;
            --light: #fff3cf;
            --border: #79b4c9;
            --accent: #79b4c9;
            --active-item: #ebd48e;
            --topbar-bg: rgba(255, 235, 175, 0.94);
            --tag-bg: #79b4c9;
            --tag-fg: #ffffff;
        }

        body[data-theme="palette-two"] {
            --bg: #FFEBAF;
            --sidebar-bg: #f7e3a6;
            --panel: #FFEBAF;
            --fg: #802025;
            --gray: #b94a50;
            --light: #fff3cf;
            --border: #EF5D64;
            --accent: #EF5D64;
            --active-item: #ebd48e;
            --topbar-bg: rgba(255, 235, 175, 0.94);
            --tag-bg: #EF5D64;
            --tag-fg: #ffffff;
        }

        body[data-theme="palette-three"] {
            --bg: #A37B47;
            --sidebar-bg: #966f3d;
            --panel: #A37B47;
            --fg: #FFEec2;
            --gray: #ebd4b0;
            --light: #876233;
            --border: #DBC88A;
            --accent: #DBC88A;
            --active-item: #7a582c;
            --topbar-bg: rgba(163, 123, 71, 0.94);
            --tag-bg: #DBC88A;
            --tag-fg: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", "Glacial Indifference", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* ── APP LAYOUT ── */
        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 300;
            padding: 20px 14px;
            overflow-y: auto;
            scrollbar-width: none;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar::-webkit-scrollbar { display: none; }

        /* Brand Logo Box */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--fg);
            margin-bottom: 22px;
            padding: 0 4px;
        }
        .brand-icon-box {
            width: 36px;
            height: 36px;
            background: #ffffff;
            color: #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 900;
            font-family: serif;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }
        .brand-name {
            font-size: 1.28rem;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        /* Sidebar Search */
        .sidebar-search-row {
            margin-bottom: 22px;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px 8px;
            transition: all 0.2s ease;
        }
        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .search-container input {
            width: 100%;
            padding: 8px 6px;
            font-size: 0.84rem;
            font-family: inherit;
            border: none;
            background: transparent;
            color: var(--fg);
            outline: none;
        }
        .search-container input::placeholder {
            color: var(--gray);
            font-size: 0.82rem;
        }
        .search-container button {
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }
        .search-container button:hover {
            color: var(--fg);
        }

        /* Sidebar Nav Sections */
        .nav-group {
            margin-bottom: 20px;
        }
        .nav-group-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gray);
            padding: 0 10px 8px;
        }
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            list-style: none;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            background: var(--light);
            color: var(--fg);
        }
        .nav-link.active {
            background: var(--active-item);
            color: var(--fg);
            font-weight: 600;
            border-color: var(--border);
        }
        .nav-link svg {
            width: 18px;
            height: 18px;
            opacity: 0.85;
            flex-shrink: 0;
        }
        .nav-link.active svg {
            color: var(--accent);
            opacity: 1;
        }

        /* Category Pills in Sidebar */
        .category-pills {
            display: flex;
            flex-direction: column;
            gap: 3px;
            list-style: none;
        }
        .pill-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--gray);
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .pill-item:hover {
            background: var(--light);
            color: var(--fg);
        }
        .pill-item.active {
            background: var(--active-item);
            color: var(--fg);
            font-weight: 600;
            border-color: var(--border);
        }
        .pill-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.85;
            flex-shrink: 0;
        }
        .pill-item.active svg {
            color: var(--accent);
            opacity: 1;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* ── MAIN CONTENT AREA ── */
        .main-content-wrap {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--sidebar-width));
        }

        /* ── TOPBAR ── */
        .topbar {
            background: var(--topbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .mobile-toggle-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }
        .topbar-wordmark {
            font-family: "Pinyon Script", "Parisienne", cursive;
            font-size: 2.2rem;
            color: var(--fg);
            text-decoration: none;
            line-height: 1;
        }
        .topbar-right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .region-badge-btn {
            background: var(--light);
            border: 1px solid var(--border);
            color: var(--fg);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .region-badge-btn:hover {
            border-color: var(--accent);
        }

        /* ── FEED CONTENT ── */
        .content {
            padding: 24px 32px 60px;
            max-width: 1480px;
            width: 100%;
        }

        /* ── HERO MAGAZINE SECTION ── */
        .hero-section {
            border-bottom: 2px solid var(--border);
            padding-bottom: 28px;
            margin-bottom: 28px;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }
        .hero-lead {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: minmax(280px, 1.15fr) minmax(280px, 0.9fr);
            gap: 28px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .hero-lead:hover {
            background: var(--light);
            border-color: var(--accent);
        }
        .hero-lead-media {
            min-height: 300px;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--light);
        }
        .hero-lead-img {
            width: 100%;
            height: 100%;
            min-height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .hero-lead:hover .hero-lead-img { transform: scale(1.02); }
        .hero-lead-img-placeholder {
            width: 100%; height: 100%; min-height: 300px;
            display: flex; align-items: center; justify-content: center;
            color: var(--gray); font-size: 2.5rem;
        }
        .hero-lead-body {
            display: flex; flex-direction: column; justify-content: center;
            gap: 14px;
        }
        .hero-lead-attr, .hero-side-attr {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--accent);
        }
        .hero-lead-title {
            font-size: clamp(1.8rem, 3.2vw, 2.8rem);
            font-weight: 700; line-height: 1.1;
            font-family: var(--headline-font); color: var(--fg);
        }
        .hero-lead-summary {
            font-size: 0.95rem; color: var(--gray); line-height: 1.6;
        }
        .hero-lead-list {
            display: grid; gap: 6px;
        }
        .hero-lead-item {
            font-size: 0.86rem; color: var(--fg); font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        .hero-lead-item::before {
            content: "•"; color: var(--accent); font-size: 1.2rem;
        }

        .hero-side {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background 0.15s, border-color 0.15s;
        }
        .hero-side:hover {
            background: var(--light);
            border-color: var(--accent);
        }
        .hero-side-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 6px;
        }
        .hero-side-img-placeholder {
            width: 100%; aspect-ratio: 16/9;
            background: var(--light);
            display: flex; align-items: center; justify-content: center;
            color: var(--gray); font-size: 2rem; border-radius: 6px;
        }
        .hero-side-body {
            display: flex; flex-direction: column; gap: 8px;
        }
        .hero-side-title {
            font-size: 1.15rem; font-weight: 700; line-height: 1.25;
            font-family: var(--headline-font); color: var(--fg);
        }
        .hero-side-summary {
            font-size: 0.85rem; color: var(--gray); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .hero-sources-btn {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--gray); background: var(--light); border: 1px solid var(--border);
            border-radius: 4px; padding: 4px 8px; cursor: pointer; align-self: flex-start;
        }

        /* ── MORE STORIES GRID ── */
        .more-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
            margin-top: 10px;
        }
        .more-label {
            grid-column: 1 / -1;
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gray);
            margin-bottom: 6px;
        }
        .cluster-row {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background 0.15s, border-color 0.15s;
        }
        .cluster-row:hover {
            background: var(--light);
            border-color: var(--accent);
        }
        .cr-img-col {
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: 6px;
            background: var(--light);
        }
        .cr-img {
            width: 100%; height: 100%; object-fit: cover;
            display: block; transition: transform 0.35s ease;
        }
        .cluster-row:hover .cr-img { transform: scale(1.03); }
        .cr-img-placeholder {
            width: 100%; height: 100%; min-height: 180px;
            display: flex; align-items: center; justify-content: center;
            color: var(--gray); font-size: 2rem;
        }
        .cr-text-col { display: flex; flex-direction: column; gap: 8px; }
        .cr-title {
            font-size: 1.2rem; font-weight: 700; line-height: 1.3;
            font-family: var(--headline-font); color: var(--fg);
        }
        .cr-summary {
            font-size: 0.88rem; color: var(--gray); line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .cr-meta-col {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto;
        }
        .cr-badge {
            font-size: 0.6rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            background: var(--tag-bg); color: var(--tag-fg); padding: 3px 8px; border-radius: 4px;
        }
        .cr-date {
            font-size: 0.68rem; text-transform: uppercase; color: var(--gray);
        }
        .cr-sources-btn {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            color: var(--gray); background: var(--light); border: 1px solid var(--border);
            border-radius: 4px; padding: 3px 8px; cursor: pointer;
        }

        .sources-panel {
            display: none; background: var(--bg);
            border: 1px solid var(--border); border-left: 3px solid var(--accent);
            border-radius: var(--radius); margin-top: 10px; max-height: 220px; overflow-y: auto;
        }
        .sources-panel.open { display: block; }
        .source-item {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 8px 12px; border-bottom: 1px dotted var(--border);
        }
        .source-item:last-child { border-bottom: none; }
        .source-link {
            font-size: 0.8rem; font-weight: 600; color: var(--fg); text-decoration: none;
            flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .source-link:hover { text-decoration: underline; }
        .source-domain {
            font-size: 0.62rem; font-weight: 700; color: var(--gray); text-transform: uppercase;
            background: var(--light); padding: 2px 6px; border-radius: 3px;
        }

        .status { text-align: center; padding: 50px 0; color: var(--gray); font-size: 0.92rem; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }

        /* Responsive Mobile Drawer */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.6); }
            .main-content-wrap { margin-left: 0; width: 100%; }
            .mobile-toggle-btn { display: block; }
            .content { padding: 16px; }
            .hero-grid { grid-template-columns: 1fr; }
            .hero-lead { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-testid="body">

    <aside class="sidebar" id="sidebar" data-testid="sidebar">

                </li>
                <li>

                    </a>
                </li>
                <li>
                    <a href="/roundup" class="nav-link" data-testid="nav-roundup">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        <span>AI Roundups</span>
                    </a>
                </li>

                    <a href="/history" class="nav-link" data-testid="nav-history">

                        <span>Reading History</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Section 2: Categories -->
        <div class="nav-group">
            <div class="nav-group-title">Categories</div>
            <div class="category-pills" id="category-pills" data-testid="category-pills">
                <button class="pill-item active" data-query="__home__" data-testid="pill-home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>All Top Stories</span>
                </button>
                <button class="pill-item" data-query="technology" data-testid="pill-technology">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    <span>Technology</span>
                </button>
                <button class="pill-item" data-query="business" data-testid="pill-business">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <span>Business</span>
                </button>
                <button class="pill-item" data-query="sports" data-testid="pill-sports">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M6 12a6 6 0 0 1 12 0"></path></svg>
                    <span>Sports</span>
                </button>
                <button class="pill-item" data-query="health" data-testid="pill-health">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span>Health</span>
                </button>
                <button class="pill-item" data-query="culture" data-testid="pill-culture">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>Culture</span>
                </button>
            </div>
        </div>

        <!-- Sidebar Bottom Actions -->
        <div class="sidebar-footer">
            <a href="mailto:support@lacunanews.com?subject=Feedback" class="nav-link" data-testid="feedback-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Feedback</span>
            </a>
            <a href="/settings" class="nav-link" id="settings-nav-btn" data-testid="settings-nav-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Settings</span>
            </a>
            <div class="nav-link" onclick="toggleSidebarTheme()" data-testid="theme-toggle-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <span>Theme</span>
            </div>
            {% if user %}
            <a href="/settings" class="nav-link" data-testid="user-profile-btn">
                <div class="user-chip-avatar" data-testid="user-chip-avatar" style="width:20px;height:20px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:bold;">{{ (user['username'] or 'U')[:1]|upper }}</div>
                <span data-testid="user-chip-name">{{ user['username'] }}</span>
            </a>
            {% else %}
            <a href="/login" class="nav-link" data-testid="login-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                <span>Sign in</span>
            </a>
            {% endif %}
        </div>

    </aside>

    <!-- ── RIGHT CONTENT WRAPPER ── -->
    <div class="main-content-wrap">

        <!-- Topbar -->
        <header class="topbar" data-testid="topbar">
            <button class="mobile-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar">☰</button>
            <a href="/" class="topbar-wordmark" data-testid="topbar-wordmark">Lacuna</a>
            <div class="topbar-right-actions">
                <a href="/settings" class="region-badge-btn" title="Change Region">
                    <span>🌐</span>
                    <span id="active-region-label">{{ default_region or 'US' }}</span>
                </a>
            </div>
        </header>

        <!-- Dynamic Content -->
        <main class="content" data-testid="main-content">
            <div id="story-feed" data-testid="story-feed">
                <div class="status blink" data-testid="feed-status">Loading feed clusters...</div>
            </div>
        </main>

    </div>

</div>

<script>
    window.REGIONS = {{ regions|tojson }};
    window.CURRENT_USER = {{ user['username']|tojson if user else 'null' }};
    window.USER_REGION = {{ (default_region or 'US')|tojson }};

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('open');
    }

    function toggleSidebarTheme() {
        const body = document.body;
        const current = body.getAttribute('data-theme') || 'pitch-black';
        const next = current === 'pitch-black' ? 'light' : 'pitch-black';
        body.setAttribute('data-theme', next);
        localStorage.setItem('lacuna_theme', next);
    }
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
